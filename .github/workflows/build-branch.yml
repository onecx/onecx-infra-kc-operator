name: Build Feature Branch

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!main'
      - '!fix/[0-9]+.[0-9]+.x'
      - '![0-9]+.x'
      - '!dependabot/**'

jobs:
  helm:
    uses: onecx/ci-common/.github/workflows/helm-build.yml@v1
    secrets: inherit
    with:
      helmDir: 'helm'
      artifact: ''
      templateValuesYaml: ''